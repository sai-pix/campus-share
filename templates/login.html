
{% extends "base.html" %}

{% block title %}Login | CampusShare{% endblock %}

{% block content %}

<section class="auth-container">

    <div class="auth-card">

        <div class="auth-heading">

            <span class="eyebrow">WELCOME BACK</span>

            <h1>Sign in to CampusShare</h1>

            <p>
                Continue sharing and discovering resources
                within your campus.
            </p>

        </div>

        <form method="POST">

            <div class="form-group">
                <label>College Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your college email"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="primary-button">
                Sign In →
            </button>

        </form>

        <div class="login-footer">

            <p class="auth-bottom">
                Don't have an account?
                <a href="{{ url_for('auth.register') }}">
                    Create account
                </a>
            </p>

            <p class="forgot-link">
                <a href="{{ url_for('auth.forgot_password') }}">
                    Forgot Password?
                </a>
            </p>

        </div>

    </div>

</section>

{% endblock %}
